name: Docker Multi-Arch Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  # Job für AMD64
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Update QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu binfmt-support qemu-user-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Define dynamic tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)_v1.3.6" >> $GITHUB_ENV

      - name: Build and push AMD64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t lightningpicture/amd64-thesillyhome-dev:${{ env.tag }} \
            -t lightningpicture/amd64-thesillyhome-dev:latest .

  # Job für AARCH64 (Startet erst nach AMD64)
  build-aarch64:
    runs-on: ubuntu-latest
    needs: build-amd64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Update QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu binfmt-support qemu-user-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Define dynamic tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)_v1.3.6" >> $GITHUB_ENV

      - name: Build and push AARCH64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t lightningpicture/aarch64-thesillyhome-dev:${{ env.tag }} \
            -t lightningpicture/aarch64-thesillyhome-dev:latest .

  # Job für ARMv7 (Startet erst nach AARCH64)
  build-armv7:
    runs-on: ubuntu-latest
    needs: build-aarch64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Update QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu binfmt-support qemu-user-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Define dynamic tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)_v1.3.6" >> $GITHUB_ENV

      - name: Build and push ARMv7
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --push \
            -t lightningpicture/armv7-thesillyhome-dev:${{ env.tag }} \
            -t lightningpicture/armv7-thesillyhome-dev:latest .
