name: Docker Multi-Arch Image CI

on:
  push:
    branches: [ "master" ]

env:
  VERSION: "v1.4.0" 

jobs:
  setup-qemu:
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU for multi-arch builds
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
      - name: Restart QEMU to prevent segmentation faults
        run: |
          sudo systemctl restart binfmt-support || true

  build-amd64:
    runs-on: ubuntu-latest
    needs: setup-qemu
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Define dynamic tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)_${{ env.VERSION }}" >> $GITHUB_ENV

      - name: Build and push AMD64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t lightningpicture/amd64-thesillyhome-dev:${{ env.tag }} \
            -t lightningpicture/amd64-thesillyhome-dev:latest .

  build-aarch64:
    runs-on: ubuntu-latest
    needs: build-amd64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64

      - name: Enable Cross-Compilation
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Define dynamic tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)_${{ env.VERSION }}" >> $GITHUB_ENV

      - name: Build and push AARCH64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t lightningpicture/aarch64-thesillyhome-dev:${{ env.tag }} \
            -t lightningpicture/aarch64-thesillyhome-dev:latest .

  build-armv7:
    runs-on: ubuntu-latest
    needs: build-aarch64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm

      - name: Enable Cross-Compilation
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Define dynamic tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)_${{ env.VERSION }}" >> $GITHUB_ENV

      - name: Build and push ARMv7
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --push \
            -t lightningpicture/armv7-thesillyhome-dev:${{ env.tag }} \
            -t lightningpicture/armv7-thesillyhome-dev:latest .
